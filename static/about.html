<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>この掲示板について - テスト前ヘルプ板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="card">
    <h1>テスト前ヘルプ板について</h1>
    <p>定期テストや共通テストの前に、わからない問題を高校生どうしで教え合うための掲示板です。</p>
    <h2>使い方</h2>
    <ol>
      <li>教科を選んで質問を投稿する（問題の写真も貼れます）</li>
      <li>わかる人が考え方を教える</li>
      <li>理解できたら「わかった！」ボタンで解決済みにする</li>
    </ol>
    <h2>ルール</h2>
    <ul>
      <li>本名・学校名・連絡先は書かない</li>
      <li>答えの丸写しではなく、考え方を共有しよう</li>
      <li>テスト中の投稿は禁止</li>
    </ul>
    <p><a href="/">掲示板にもどる</a></p>
  </section>
</main>
</body>
</html>
